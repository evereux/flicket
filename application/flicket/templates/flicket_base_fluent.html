<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- if g.user.is_authenticated %}
    <meta name="flicket-api-token" content="{{ g.user.token }}">
    {%- endif %}

    <title>{{ g.application_title }}{% if title %} - {{ title }} {% endif %}</title>

    <script>
        (function () {
            var theme = null;
            try {
                theme = localStorage.getItem('flicket-theme');
            } catch (e) {
            }
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('flicket_bp.static', filename='css/fluent-tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('flicket_bp.static', filename='css/flicket-fluent.css') }}">

    <script type="module" src="{{ url_for('flicket_bp.static', filename='js/fluent/web-components.min.js') }}"></script>
    <script src="{{ url_for('flicket_bp.static', filename='js/hide_element.js') }}"></script>
    <script src="{{ url_for('flicket_bp.static', filename='js/flicket-fluent.js') }}" defer></script>

    <link rel="shortcut icon" href="{{ url_for('flicket_bp.static', filename='icons/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('flicket_bp.static', filename='icons/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('flicket_bp.static', filename='icons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('flicket_bp.static', filename='icons/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('flicket_bp.static', filename='icons/site.webmanifest') }}">
</head>
<body data-api-base="{{ config['FLICKET_API'] }}">

{% include 'flicket_navbar_fluent.html' %}

<main class="fl-main">
    {% include 'flicket_flashmessages_fluent.html' %}
    {% block content %}{% endblock %}
</main>

{% include 'flicket_footer.html' %}

</body>
</html>
