{% extends "flicket_base_fluent.html" %}
<!-- extend from base layout -->
{% block content %}
    <section class="fl-card">
        <div class="fl-stack">
            <h1 class="fl-title">{{ title }}</h1>
            <p class="fl-muted">
                {{ _('Ticket content supports markdown syntax. Please refer to the') }}
                <a href="{{ url_for('flicket_bp.markdown_primer') }}" target="_blank" rel="noopener">{{ _('Markdown primer') }}</a>.
            </p>
        </div>
    </section>

    <section class="fl-card">
        {% include 'flicket_post_box_fluent.html' %}
    </section>
{% endblock %}
